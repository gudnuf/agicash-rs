[package]
name = "agicash-cashu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agicash-domain = { path = "../agicash-domain" }
agicash-money = { path = "../agicash-money" }
agicash-traits = { path = "../agicash-traits" }
async-trait = { workspace = true }
cdk = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
lightning-invoice = { version = "0.34", default-features = false, features = ["std"] }
parking_lot = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
uuid = { workspace = true }

# Tokio is target-gated: native targets get the workspace feature set
# (rt-multi-thread, signal, time, sync, macros). wasm32 keeps only the
# wasm-safe surface — sync + macros + time — because rt-multi-thread and
# signal pull `mio`, which fails on wasm with
# "This wasm target is unsupported by mio". See spec
# `2026-05-17-storage-supabase-wasm-port-design.md`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.42", default-features = false, features = ["sync", "macros", "time"] }

[dev-dependencies]
agicash-domain = { path = "../agicash-domain" }
agicash-money = { path = "../agicash-money" }
chrono = { workspace = true }
dotenvy = { workspace = true }
rust_decimal = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[features]
real-mint-tests = []

[lints]
workspace = true
