[package]
name = "agicash-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Resumption driver — re-fires service methods on unresolved wallet rows (the Rust port of React's useProcessXTasks)"

[dependencies]
agicash-wallet = { path = "../agicash-wallet" }
agicash-cashu = { path = "../agicash-cashu" }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
agicash-domain = { path = "../agicash-domain" }
agicash-money = { path = "../agicash-money" }
agicash-testing = { path = "../agicash-testing" }
agicash-traits = { path = "../agicash-traits" }
async-trait = { workspace = true }
cdk = { workspace = true }
rust_decimal = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
