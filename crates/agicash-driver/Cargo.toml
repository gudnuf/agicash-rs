[package]
name = "agicash-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Resumption driver — re-fires service methods on unresolved wallet rows (the Rust port of React's useProcessXTasks)"

[dependencies]
agicash-wallet = { path = "../agicash-wallet" }
agicash-cashu = { path = "../agicash-cashu" }
agicash-realtime = { path = "../agicash-realtime" }
async-broadcast = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time", "sync", "rt", "macros"] }

# Wasm runtime split (Lane C). We deliberately do NOT pull `gloo-timers` —
# `agicash-realtime` set the precedent of wrapping the JS global
# `setTimeout` via `js-sys` + `wasm-bindgen-futures` (its `wasm_sleep_ms`
# helper). We duplicate that ~20 LOC here rather than expose a helper
# across crates (lane discipline §7: scope is `crates/agicash-driver/**`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }

[dev-dependencies]
agicash-domain = { path = "../agicash-domain" }
agicash-money = { path = "../agicash-money" }
agicash-testing = { path = "../agicash-testing" }
agicash-traits = { path = "../agicash-traits" }
async-trait = { workspace = true }
cdk = { workspace = true }
rust_decimal = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
