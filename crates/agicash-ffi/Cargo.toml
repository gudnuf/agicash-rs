[package]
name = "agicash-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FFI bindings for the Agicash wallet SDK"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "agicash_ffi"

[features]
default = []
# Re-export of `agicash-auth-opensecret`'s `android-file-storage` feature.
# The `AndroidFileSessionStorage` type the FFI wallet installs in
# `set_session_storage_dir` lives behind this feature. We don't gate it on
# `target_os = "android"` in this crate's `[features]` table because cargo
# features must be target-independent; the actual storage type is itself
# only re-exported on `target_os = "android"` (see
# `crates/agicash-auth-opensecret/src/lib.rs`), so on iOS / host this
# feature only pulls in the `aes-gcm` dep at the cost of a few hundred kb.
# The Kotlin bindings wrapper crate (`bindings/kotlin/rust/Cargo.toml`)
# enables this feature on the agicash-ffi dep so Android builds get the
# file backend; iOS bindings + tests leave it off.
android-file-storage = ["agicash-auth-opensecret/android-file-storage"]

[dependencies]
agicash-domain = { path = "../agicash-domain" }
agicash-money = { path = "../agicash-money" }
agicash-traits = { path = "../agicash-traits" }
agicash-auth-opensecret = { path = "../agicash-auth-opensecret" }
agicash-storage-supabase = { path = "../agicash-storage-supabase" }
agicash-cashu = { path = "../agicash-cashu" }
agicash-exchange-rate = { path = "../agicash-exchange-rate" }
agicash-lightning-address = { path = "../agicash-lightning-address" }
agicash-realtime = { path = "../agicash-realtime" }
agicash-driver = { path = "../agicash-driver" }
agicash-wallet = { path = "../agicash-wallet" }
async-trait = { workspace = true }
cdk = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread"] }
uniffi = { workspace = true, features = ["tokio"] }
uuid = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# `tracing-oslog` only links on Apple targets (it FFIs into the
# `os_log` C symbols in libSystem). Gate it so the wasm + linux CI
# targets still compile cleanly. On non-Apple targets the FFI install
# falls back to a `tracing-subscriber` fmt layer.
[target.'cfg(target_vendor = "apple")'.dependencies]
tracing-oslog = { workspace = true }

# Android-only: the platform certificate verifier needs a JVM + Context
# handle before it can validate TLS chains. Initialized once from
# `MainActivity.onCreate` via the JNI shim in `src/android_tls.rs`. Without
# this init, every `reqwest` call that uses
# `rustls::ClientConfig::with_platform_verifier()` panics with
# "Expect rustls-platform-verifier to be initialized" — iOS does not need
# the same call because `Security.framework` is process-global.
[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = { workspace = true }
jni = "0.22"
# Android-only sink for the FFI's `tracing` subscriber. `tracing-android`
# is a tracing-subscriber Layer that routes each event through liblog's
# `__android_log_write`, so events show up as logcat lines under a tag
# we control (here: `agicash.rust`). Filter with
# `adb logcat -s agicash.rust:*`.
tracing-android = "0.2"

[dev-dependencies]
# Lane D tests construct a real `agicash_driver::DriverHandle` over a
# manually-created `async_broadcast` channel. Production code doesn't
# touch async-broadcast directly (the realtime service does that), so
# it lives in dev-deps only.
async-broadcast = { workspace = true }

[lints]
workspace = true
