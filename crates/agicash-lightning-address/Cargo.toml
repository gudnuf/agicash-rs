[package]
name = "agicash-lightning-address"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Native: full reqwest (workspace pin = rustls-tls). wasm32: browser
# `fetch` handles TLS — drop rustls/ring entirely. Mirrors
# agicash-storage-supabase's already-shipped target gate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[features]
# Network-hitting integration tests. Run with:
#   `cargo test -p agicash-lightning-address --features real-network-tests`
real-network-tests = []

[lints]
workspace = true
