[package]
name = "agicash-realtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Supabase Realtime (Phoenix v2) client for the Agicash wallet"

[dependencies]
agicash-traits = { path = "../agicash-traits" }
agicash-domain = { path = "../agicash-domain" }
# Realtime parses each broadcast into typed `*Row` structs (see `payload.rs`).
# `agicash-storage-supabase` is wasm-clean (Leptos already links it on wasm),
# so depending on it from this crate keeps both targets building.
agicash-storage-supabase = { path = "../agicash-storage-supabase" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-broadcast = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tokio-tungstenite = { workspace = true }
tungstenite = { workspace = true }
# Native TLS verifier — Security.framework on Apple, system cacerts on
# Android, OS roots on desktop. Mirrors the `agicash-storage-supabase`
# REST path so the iOS Simulator mkcert root is honoured by the
# realtime WSS handshake too (see `transport_native.rs::connect`).
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
dotenvy = { workspace = true }

[features]
default = []
real-supabase-tests = []

[lints]
workspace = true
