[package]
name = "agicash-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Tier 1 (hermetic) deps are always-on + wasm32-clean (no real-socket /
# process deps). The Tier 2 `ServiceHarness` (Tasks 4-7) adds
# `agicash-auth-opensecret` + `reqwest` + `tokio/process` + `tempfile` +
# `cdk-fake-wallet`, native-only (the `cfg(not(wasm32))` target table) and
# the harness module itself is `#[cfg(all(feature="tier2-e2e",
# not(target_arch="wasm32")))]` so wasm32 + the default Tier 1 build never
# pull a real-socket / process dep.
[dependencies]
agicash-domain = { path = "../agicash-domain" }
agicash-money = { path = "../agicash-money" }
agicash-traits = { path = "../agicash-traits" }
agicash-cashu = { path = "../agicash-cashu" }
agicash-wallet = { path = "../agicash-wallet" }
agicash-exchange-rate = { path = "../agicash-exchange-rate" }
async-trait = { workspace = true }
parking_lot = { workspace = true }
cdk = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
serde_json = { workspace = true }

# Native-only Tier 2 harness deps. Present for native builds (the harness
# module is additionally feature-gated); absent from the wasm32 target so
# `agicash-testing` + dependents stay wasm32-clean.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agicash-auth-opensecret = { path = "../agicash-auth-opensecret" }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["process", "time", "rt", "macros"] }
tempfile = "3"
# Externally-signed bolt11 generator for the NUT-05 melt e2e (the melt
# target invoice). cdk-fake-wallet only depends on cdk-common (no
# protoc/tonic), so this adds no heavy build deps. Pinned to the cdk 0.15.1
# the workspace locks (NUT wire protocol must match the spawned mint).
cdk-fake-wallet = { version = "0.15.1", optional = true }

[features]
# Tier 2 real-service e2e harness (real cdk-mintd + real OpenSecret
# enclave, no docker). Native-only; pulls the bolt11 generator.
tier2-e2e = ["dep:cdk-fake-wallet"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
