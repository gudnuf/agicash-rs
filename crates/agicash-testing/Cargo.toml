repository.workspace = true

# Tier 1 (hermetic) scope only — Tasks 1-3 of
# plans/2026-05-19-fake-harness-mini-slice.md. The Tier 2 `ServiceHarness`
# (Tasks 4-7) adds `agicash-auth-opensecret` + `reqwest` + `tokio/process`
