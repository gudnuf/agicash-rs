[package]
name = "agicash-wallet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agicash-domain = { path = "../agicash-domain" }
agicash-money = { path = "../agicash-money" }
agicash-traits = { path = "../agicash-traits" }
agicash-auth-opensecret = { path = "../agicash-auth-opensecret" }
agicash-cashu = { path = "../agicash-cashu" }
agicash-exchange-rate = { path = "../agicash-exchange-rate" }
agicash-lightning-address = { path = "../agicash-lightning-address" }
agicash-storage-supabase = { path = "../agicash-storage-supabase" }
agicash-realtime = { path = "../agicash-realtime" }
async-trait = { workspace = true }
cdk = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# tokio: only sync primitives are used in the facade (RwLock in
# OpenSecretAuthClient). Native takes the workspace tokio; wasm takes a
# minimal default-features=false set (no rt-multi-thread/signal/mio).
# Mirrors agicash-cashu's already-shipped target gate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.42", default-features = false, features = ["sync", "macros", "time"] }

[features]
default = ["keyring-storage"]
# Re-export of `agicash-auth-opensecret`'s `android-file-storage` feature.
# The `AndroidFileSessionStorage` type `from_config` installs for the
# `SessionStorageChoice::Android` arm lives behind this feature. It is not
# gated on `target_os = "android"` here because cargo features must be
# target-independent; the storage type itself is only re-exported on
# `target_os = "android"` (see `crates/agicash-auth-opensecret/src/lib.rs`),
# so on iOS / host this feature only pulls in the `aes-gcm` dep. The Kotlin
# bindings wrapper enables this on the agicash-ffi dep; iOS + tests leave
# it off (the cfg-not branch falls back to InMemory).
android-file-storage = ["agicash-auth-opensecret/android-file-storage"]
# Re-export of `agicash-auth-opensecret`'s `keyring-storage` feature.
# Gates the `SessionStorageChoice::Keyring` variant — passing that variant
# without this feature on is a compile error (operator decision, 2026-05-22).
# Default-off here: the CLI shell explicitly enables it; the FFI / wasm /
# Leptos shells deliberately do not. (`agicash-auth-opensecret` itself
# defaults the feature on, but cargo feature unification means turning it
# on in CLI doesn't break wasm builds — the `keyring` crate is `cfg`-gated
# off wasm32 inside `storage.rs`.)
keyring-storage = ["agicash-auth-opensecret/keyring-storage"]
# Tier 2 real-service e2e (tests/tier2_e2e.rs). Opt-in, native/local-only:
# enables the `agicash-testing` ServiceHarness (real cdk-mintd + real
# OpenSecret enclave, no docker). Without it tier2_e2e.rs compiles to a
# single skipped test (mirrors agicash-cashu's `cdk-mint-e2e` gate). NOT a
# per-PR CI gate — see the plan's CI-viability assessment.
tier2-e2e = ["agicash-testing/tier2-e2e"]

[dev-dependencies]
# Tier 1 hermetic suite (tests/tier1_hermetic.rs). `agicash-testing`
# dev-depends on `agicash-wallet` while `agicash-wallet` dev-depends on
# `agicash-testing` — a dev-only edge, no cargo cycle.
agicash-testing = { path = "../agicash-testing" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
serde_json = { workspace = true }
# Cache layer tests build base64-of-passthrough-cipher encrypted_data
# bodies to exercise the storage `toX` helpers end-to-end.
base64 = { workspace = true }

[lints]
workspace = true
