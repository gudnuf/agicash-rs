[package]
name = "agicash-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
# Pulled on all targets so the `extract_cashu_token` free function
# (a pure, no-I/O paste helper) is available from both the wasm cdylib
# and the native `rlib` build. `agicash-cashu` builds cleanly on
# wasm32; native `cargo test --workspace` already compiles it.
agicash-cashu = { path = "../agicash-cashu" }

# The real Wallet binding. agicash-wallet wasm-builds as of slice 12d
# (AuthClient ?Send + dep target-gates). Pulled on wasm32 only so the
# native `rlib` build of this crate (used by `cargo test --workspace`)
# stays minimal; the wasm cdylib is the only shipping artifact.
[target.'cfg(target_arch = "wasm32")'.dependencies]
agicash-wallet = { path = "../agicash-wallet" }
agicash-domain = { path = "../agicash-domain" }
agicash-money = { path = "../agicash-money" }
agicash-traits = { path = "../agicash-traits" }
wasm-bindgen-futures = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
rust_decimal = { workspace = true }
uuid = { workspace = true }
# Guest-registration RNG path on wasm needs the `js` getrandom backend
# (same as agicash-web-leptos). Additive feature; safe.
getrandom = { workspace = true, features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
