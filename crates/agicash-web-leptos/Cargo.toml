[package]
name = "agicash-web-leptos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The crate ships as a single wasm cdylib loaded by `index.html`. We also
# keep the `rlib` crate-type so the workspace `cargo test` can pick up
# the unit tests on native (the pure-Rust pieces — tokens, design helpers,
# anything not gated behind `target_arch = "wasm32"`).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Browser-side build is the ONLY shipping target now — the axum SSR
# server was ripped on 2026-05-17 in favour of pure CSR + direct
# `OpenSecretClient` calls from wasm. Refresh token persists in
# `window.localStorage` via `BrowserSessionStorage` (parity with the
# legacy React app's convention).
default = ["hydrate"]
hydrate = ["leptos/hydrate"]

[dependencies]
# Leptos 0.7 — fine-grained reactivity, stable reactive-graph.
# Note: not using the `nightly` features; the workspace toolchain pins
# to stable rust 1.88 (see `crates/rust-toolchain.toml`).
leptos = { version = "0.7" }
leptos_meta = { version = "0.7" }
leptos_router = { version = "0.7" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
http = "1"
# `async-trait` is needed to implement the realtime crate's
# `TransportFactory` trait for the wasm transport (slice 10).
async-trait = { workspace = true }
# `futures-util` — `StreamExt::next` to pump the realtime crate's
# `async-broadcast` event receiver (slice 10). Already a workspace dep
# (used by `agicash-realtime` itself); no new third-party crate.
futures-util = { workspace = true }

# CDK — Cashu Development Kit. We only use the parser side here
# (`cdk::nuts::Token::from_str` + `.value()/.mint_url()/.unit()/.memo()`),
# which is wasm-clean with `default-features = false, features = ["wallet"]`
# (the workspace dep already pins those — see `crates/Cargo.toml`,
# `project_agicash_wasm_path.md` for context).
cdk = { workspace = true }

# Direct opensecret client — wasm-compatible per the
# audit/auth-opensecret-wasm work. Disable default features so the
# native-only `keyring-storage` cargo feature stays off (it's gated by
# `target_arch` anyway, but skipping the dependency at request time
# keeps the dep graph clean).
agicash-auth-opensecret = { path = "../agicash-auth-opensecret", default-features = false }
agicash-traits = { path = "../agicash-traits" }
agicash-domain = { path = "../agicash-domain" }
# Typed Supabase storage — wasm-clean as of the storage-supabase wasm
# port (spec: docs/superpowers/specs/2026-05-17-storage-supabase-wasm-port-design.md).
# Replaces the direct gloo-net Supabase REST path that used to live in
# `WalletData::refresh`.
agicash-storage-supabase = { path = "../agicash-storage-supabase" }
# Cashu storage — needed for `CashuSendSwapStorage::list_unspent_proofs`
# so the home hero can show real per-account balances. Also wasm-clean
# after the storage-supabase port.
agicash-cashu = { path = "../agicash-cashu" }
agicash-money = { path = "../agicash-money" }
# The wasm-bindgen wallet shell (slice 12d) over WalletClient::from_config.
# Replaces the mocked SDK boundary in send_cashu_view /
# cashu_token_paste_view. `AgicashWasmWallet` is `cfg(target_arch="wasm32")`;
# the native rlib build only sees the version fn (call sites are gated).
agicash-wasm = { path = "../agicash-wasm" }
# The `agicash-wallet` facade — `fetch_pending_state` calls
# `WalletClient::refresh_pending_state` (the FFI/wasm-shared in-flight
# money-state aggregator) instead of hand-rolling the four storage
# reads. wasm-composable since c11731cf cfg-gated its deps; the native
# rlib build only links it for the `target_arch = "wasm32"` call site.
agicash-wallet = { path = "../agicash-wallet" }
# Supabase Realtime client (slice 10). Leptos links the crate directly
# (no FFI) — it drives the balance refresh, replacing the deleted
# `start_visibility_refresh` visibilitychange/focus/poll Tier-1 hack.
agicash-realtime = { path = "../agicash-realtime" }

# Browser-side runtime deps. Always-on now that ssr is gone — the
# `target_arch = "wasm32"` cfg in `lib.rs::hydrate` keeps the native
# `rlib` build (for unit tests) from trying to pull these in.
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
# Reads the JSON array `AgicashWasmWallet::list_accounts()` returns
# (the real account-list lookup behind the receive flow's "Add mint
# first?" hint — replaces the old hard-coded mint allowlist).
serde-wasm-bindgen = { workspace = true }
console_error_panic_hook = "0.1"
# `gloo-timers` gives us a wasm-safe Future-based sleep. Used by the
# mocked Cashu redeem path to simulate the WalletClient round-trip
# (see `// TODO[slice-12]` in `components/cashu_token_paste_view.rs`).
gloo-timers = { version = "0.3", default-features = false, features = ["futures"] }
# `js-sys` + `web-sys` — used by the `ShareSheet` component to call the
# Web Share API (`navigator.share`) with a clipboard fallback, by the
# LoginView's guest-auth path for getrandom-on-wasm wiring, and by
# `WalletData::start_visibility_refresh` for the `visibilitychange` /
# window `focus` balance-refresh listeners (`EventTarget`).
js-sys = { workspace = true }
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlMetaElement",
    "Navigator",
    "Window",
    "Storage",
    "ShareData",
    "VisibilityState",
] }

# `getrandom` for the throwaway guest-registration password. Wasm
# support requires the `js` feature; the native `rlib` build doesn't
# need it but the feature is additive so it's safe to enable
# unconditionally.
getrandom = { workspace = true, features = ["js"] }

[lints]
workspace = true
